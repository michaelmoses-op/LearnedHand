[project]
name = "learnedhand-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.15.0",
  "sqlalchemy[asyncio]>=2.1.1",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "structlog>=26.1.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "argon2-cffi>=25.1.0",
  "pyjwt>=2.15.1",
  "pgvector>=0.3",
  "lxml>=5.0",
  "tiktoken>=0.7",
  "nh3>=0.3.7",
  "openai>=3.22.0",
  "pymupdf>=1.28.2",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Local cross-encoder reranker (pulls in PyTorch, ~1 GB). Install with: uv sync --extra rerank
rerank = ["sentence-transformers>=3"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.16.9",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", ".."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"../evals/*" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "../evals"]
mypy_path = [".."]

[[tool.mypy.overrides]]
module = ["alembic.*", "asyncpg.*", "lxml.*", "tiktoken.*", "pgvector.*", "nh3.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".", ".."]  # ".." exposes the repo-root `evals` package

[tool.coverage.run]
source = ["app"]
